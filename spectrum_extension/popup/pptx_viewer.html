<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPeCTRUM PRO — PPTX Presentation Reader</title>
  
  <!-- ChristopherVR OOXML Stylesheet -->
  <link rel="stylesheet" href="../libs/pptx-vanilla-viewer.styles.css">
  <link rel="stylesheet" href="popup.css">

  <style>
    :root {
      color-scheme: light dark;
      --bg-canvas: #0d0f12;
      --bg-panel: #13161b;
      --bg-card: #181c22;
      --bg-card-hover: #1f242c;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-medium: rgba(255, 255, 255, 0.12);
      --border-active: rgba(255, 255, 255, 0.3);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-orange: #fb923c;
    }

    [data-theme="light"] {
      --bg-canvas: #f8fafc;
      --bg-panel: #ffffff;
      --bg-card: #f1f5f9;
      --bg-card-hover: #e2e8f0;
      --border-subtle: #e2e8f0;
      --border-medium: #cbd5e1;
      --border-active: #94a3b8;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent-orange: #ea580c;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Toolbar */
    .viewer-header {
      height: 52px;
      min-height: 52px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-medium);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 12px;
      user-select: none;
      z-index: 10;
    }

    .viewer-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .viewer-logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      background: rgba(251, 146, 60, 0.12);
      border: 1px solid rgba(251, 146, 60, 0.28);
      border-radius: 6px;
      font-family: var(--font-mono, monospace);
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-orange);
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .viewer-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 380px;
    }

    .viewer-toolbar-center {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border-medium);
      border-radius: 8px;
      padding: 3px 6px;
    }

    .viewer-tool-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 28px;
      padding: 0 10px;
      background: transparent;
      border: none;
      border-radius: 5px;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .viewer-tool-btn:hover:not(:disabled) {
      background: var(--bg-card-hover);
      color: var(--text-primary);
    }

    .viewer-tool-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .viewer-slide-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-mono, monospace);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
      padding: 0 4px;
      min-width: 60px;
      text-align: center;
    }

    .slide-jump-input {
      width: 36px;
      height: 22px;
      background: var(--bg-canvas);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      color: var(--text-primary);
      font-family: var(--font-mono, monospace);
      font-size: 11.5px;
      font-weight: 700;
      text-align: center;
      outline: none;
    }

    .slide-jump-input:focus {
      border-color: var(--accent-orange);
    }

    .slide-jump-input::-webkit-inner-spin-button, 
    .slide-jump-input::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }

    .viewer-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .viewer-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-medium);
      border-radius: 6px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .viewer-action-btn:hover:not(:disabled) {
      background: var(--bg-card-hover);
      border-color: var(--border-active);
    }

    .viewer-action-btn.is-primary {
      background: #f8fafc;
      color: #0f172a;
      border-color: #f8fafc;
      font-weight: 700;
    }

    .viewer-action-btn.is-primary:hover:not(:disabled) {
      background: #ffffff;
      color: #000000;
      box-shadow: 0 2px 8px rgba(255, 255, 255, 0.2);
    }

    .viewer-action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Main Presentation Canvas Container */
    .viewer-main-stage {
      flex: 1;
      width: 100%;
      height: calc(100vh - 52px);
      position: relative;
      overflow: hidden;
      display: flex;
      background: var(--bg-canvas);
    }

    #pptx-viewer {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
      display: flex;
    }

    /* Empty / Drag & Drop Dropzone Overlay */
    .viewer-empty-dropzone {
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
      border: 2px dashed var(--border-active);
      border-radius: 12px;
      background: var(--bg-card);
      max-width: 480px;
      gap: 16px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .viewer-empty-dropzone:hover, .viewer-empty-dropzone.dragover {
      border-color: var(--accent-orange);
      transform: translateY(-2px);
    }

    .viewer-dropzone-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(251, 146, 60, 0.12);
      border: 1px solid rgba(251, 146, 60, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-orange);
    }

    .viewer-dropzone-text h3 {
      margin: 0 0 6px 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .viewer-dropzone-text p {
      margin: 0;
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Loading Spinner */
    .viewer-loader-overlay {
      position: absolute;
      inset: 0;
      background: rgba(13, 15, 18, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 50;
      transition: opacity 0.2s ease;
    }

    .viewer-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--accent-orange);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* =====================================================================
       PURE VIEW MODE ENFORCEMENT: Suppress all edit panels, inspector,
       ribbons, formatting bars, read-only nag banners, and gizmos
       ===================================================================== */
    .pptxv-inspector,
    .pptxv-format-toolbar,
    .pptxv-ribbon,
    .pptxv-qat-row,
    .pptxv-titlebar,
    .pptxv-read-only-banner,
    .pptxv-enable-editing-banner,
    .pptxv-selection-pane,
    .pptxv-find-replace,
    .pptxv-accessibility-pane,
    .pptxv-compare-pane,
    .pptxv-handle,
    .pptxv-resizer,
    .pptxv-rotator,
    .pptxv-selection-box,
    .pptxv-selection-overlay {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    .pptxv-thumbs.is-hidden {
      display: none !important;
    }

    .pptxv-viewport {
      flex: 1;
      min-width: 0;
      height: 100%;
      position: relative;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body data-theme="dark">

  <!-- Header & Navigation Bar -->
  <header class="viewer-header">
    <div class="viewer-header-left">
      <div class="viewer-logo-badge">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5">
          <rect x="2" y="3" width="20" height="14" rx="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
        <span>PPTX READER</span>
      </div>
      <div class="viewer-title" id="doc-title" title="SPeCTRUM PRO Presentation Viewer">
        Presentation Viewer
      </div>
    </div>

    <!-- Center Navigation Controls -->
    <div class="viewer-toolbar-center">
      <button type="button" class="viewer-tool-btn" id="btn-prev" title="Previous Slide (← / PageUp)" disabled>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
        <span>Prev</span>
      </button>

      <div class="viewer-slide-indicator">
        <input type="number" id="input-slide" class="slide-jump-input" min="1" value="1" disabled title="Jump to Slide">
        <span id="slide-total" style="color: var(--text-muted); font-weight: 500;">/ --</span>
      </div>

      <button type="button" class="viewer-tool-btn" id="btn-next" title="Next Slide (→ / PageDown / Space)" disabled>
        <span>Next</span>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>

      <span style="width: 1px; height: 16px; background: var(--border-medium); margin: 0 2px;"></span>

      <button type="button" class="viewer-tool-btn" id="btn-thumbnails" title="Toggle Slide Thumbnails Sidebar" disabled>
        <span>🖼️ Thumbnails</span>
      </button>

      <button type="button" class="viewer-tool-btn" id="btn-fit" title="Zoom to Fit Screen" disabled>
        <span>Fit</span>
      </button>

      <button type="button" class="viewer-tool-btn" id="btn-zoom-in" title="Zoom In (+)" disabled>
        <span>＋</span>
      </button>

      <button type="button" class="viewer-tool-btn" id="btn-zoom-out" title="Zoom Out (-)" disabled>
        <span>－</span>
      </button>
    </div>

    <!-- Right Actions -->
    <div class="viewer-header-right">
      <button type="button" class="viewer-action-btn" id="btn-open-file" title="Open Local PowerPoint Presentation">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        <span>Open File</span>
      </button>
      <input type="file" id="file-input" accept=".pptx,.pptm,.ppsx,.potx" style="display: none;" />

      <button type="button" class="viewer-action-btn" id="btn-open-url" title="Open Presentation from Remote URL">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        <span>Open URL</span>
      </button>

      <button type="button" class="viewer-action-btn is-primary" id="btn-fullscreen" title="Start Fullscreen Slideshow (F5)" disabled>
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
        <span>Present</span>
      </button>
    </div>
  </header>

  <!-- Presentation Canvas Stage -->
  <main class="viewer-main-stage" id="viewer-stage">
    <!-- Target Container for ChristopherVR OOXML Viewer -->
    <div id="pptx-viewer">
      <div class="viewer-empty-dropzone" id="dropzone">
        <div class="viewer-dropzone-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
        </div>
        <div class="viewer-dropzone-text">
          <h3>Open a PowerPoint Presentation</h3>
          <p>Drag and drop a <code>.pptx</code> file here, or click <strong>Open File</strong> to read slides with high fidelity in pure view mode.</p>
        </div>
      </div>
    </div>

    <!-- Loading Overlay -->
    <div class="viewer-loader-overlay" id="loading-overlay" style="display: none;">
      <div class="viewer-spinner"></div>
      <div style="font-size: 13px; font-weight: 600; color: #f1f5f9;" id="loading-text">Rendering presentation...</div>
    </div>
  </main>

  <!-- ChristopherVR OOXML Vanilla Viewer Bundle & Extension Logic -->
  <script src="../libs/pptx-vanilla-viewer.bundle.js"></script>
  <script src="pptx_viewer.js"></script>
</body>
</html>
