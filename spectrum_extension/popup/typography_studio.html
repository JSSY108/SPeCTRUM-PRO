  <!-- Visual Toast -->
  <div class="wb-toast" id="toast">✔ CSS copied to clipboard!</div>

  <script>
    // State & Dynamic Typography Manager
    const root = document.documentElement;

    const elSans = document.getElementById('select-font-sans');
    const elMono = document.getElementById('select-font-mono');
    const elGlobalScale = document.getElementById('slider-global-scale');
    const elMinClamp = document.getElementById('chk-min-clamp');

    const elFsTitle = document.getElementById('slider-fs-title');
    const elLsTitle = document.getElementById('slider-ls-title');
    const elFsCode = document.getElementById('slider-fs-code');
    const elFsOcc = document.getElementById('slider-fs-occ');
    const elFsTime = document.getElementById('slider-fs-time');
    const elHBtn = document.getElementById('slider-h-btn');
    const elFsBtn = document.getElementById('slider-fs-btn');

    const codeOutput = document.getElementById('code-output');
    const toast = document.getElementById('toast');
    const viewport = document.getElementById('preview-viewport');

    function clampPx(val) {
      if (!elMinClamp.checked) return val;
      return Math.max(12, val);
    }

    function update() {
      const scale = parseFloat(elGlobalScale.value) / 100;
      document.getElementById('val-global-scale').textContent = `${Math.round(scale * 100)}%`;

      const fontSans = elSans.value;
      const fontMono = elMono.value;

      const fsTitle = Math.round(parseFloat(elFsTitle.value) * scale * 10) / 10;
      const lsTitle = (parseFloat(elLsTitle.value) / 1000) + 'em';
      const fsCode = Math.round(parseFloat(elFsCode.value) * scale * 10) / 10;
      const fsOcc = Math.round(parseFloat(elFsOcc.value) * scale * 10) / 10;
      const fsTime = Math.round(parseFloat(elFsTime.value) * scale * 10) / 10;
      const hBtn = Math.round(parseFloat(elHBtn.value) * scale);
      const fsBtn = Math.round(parseFloat(elFsBtn.value) * scale * 10) / 10;

      // Update Labels
      document.getElementById('val-fs-title').textContent = `${fsTitle}px`;
      document.getElementById('val-ls-title').textContent = lsTitle;
      document.getElementById('val-fs-code').textContent = `${fsCode}px`;
      document.getElementById('val-fs-occ').textContent = `${fsOcc}px`;
      document.getElementById('val-fs-time').textContent = `${fsTime}px`;
      document.getElementById('val-h-btn').textContent = `${hBtn}px`;
      document.getElementById('val-fs-btn').textContent = `${fsBtn}px`;

      // Apply CSS Variables
      root.style.setProperty('--font-sans', fontSans);
      root.style.setProperty('--font-mono', fontMono);
      root.style.setProperty('--fs-card-title', `${clampPx(fsTitle)}px`);
      root.style.setProperty('--ls-card-title', lsTitle);
      root.style.setProperty('--fs-header-code', `${clampPx(fsCode)}px`);
      root.style.setProperty('--fs-occ-badge', `${clampPx(fsOcc)}px`);
      root.style.setProperty('--fs-timestamp', `${clampPx(fsTime)}px`);
      root.style.setProperty('--fs-author', `${clampPx(fsTime)}px`);
      root.style.setProperty('--h-action-btn', `${hBtn}px`);
      root.style.setProperty('--fs-action-btn', `${clampPx(fsBtn)}px`);

      // Generate Clean Production CSS Code
      const cssString = `/* SPeCTRUM PRO Production Typography Configuration */
:root {
  --font-sans: ${fontSans};
  --font-mono: ${fontMono};

  /* Scaled Typographic Tokens */
  --fs-card-title: ${clampPx(fsTitle)}px;
  --ls-card-title: ${lsTitle};
  --fs-header-code: ${clampPx(fsCode)}px;
  --fs-occ-badge: ${clampPx(fsOcc)}px;
  --fs-timestamp: ${clampPx(fsTime)}px;
  --fs-author: ${clampPx(fsTime)}px;
  --h-action-btn: ${hBtn}px;
  --fs-action-btn: ${clampPx(fsBtn)}px;
}

body {
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.assign-title-text, .notice-title-text, .att-course-name {
  font-family: var(--font-sans);
  font-size: var(--fs-card-title);
  letter-spacing: var(--ls-card-title);
  font-weight: 700;
}

.assign-header-left, .notice-header-left, .att-time-hero {
  font-family: var(--font-mono);
  font-size: var(--fs-header-code);
  font-weight: 700;
}

.assign-occ-pill, .att-occ-tag {
  font-family: var(--font-mono);
  font-size: var(--fs-occ-badge);
  font-weight: 700;
}

.assign-footer-left, .notice-footer-left {
  font-family: var(--font-mono);
  font-size: var(--fs-timestamp);
  font-variant-numeric: tabular-nums;
}

.att-window-label, .att-window-sub {
  font-family: var(--font-mono);
  font-size: var(--fs-header-code);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}

.btn-assign-action, .btn-att-action, .btn-notice-open {
  height: var(--h-action-btn);
  font-size: var(--fs-action-btn);
}`;

      codeOutput.textContent = cssString;
    }

    // Attach Listeners
    [elSans, elMono, elGlobalScale, elMinClamp, elFsTitle, elLsTitle, elFsCode, elFsOcc, elFsTime, elHBtn, elFsBtn].forEach(el => {
      el.addEventListener('input', update);
      el.addEventListener('change', update);
    });

    // Presets
    const presets = {
      'production-active': {
        sans: "'Plus Jakarta Sans', -apple-system, sans-serif",
        mono: "'JetBrains Mono', monospace",
        scale: 100,
        fsTitle: 16.5,
        lsTitle: 0,
        fsCode: 12.7,
        fsOcc: 15.4,
        fsTime: 13.8,
        hBtn: 32,
        fsBtn: 14.3
      },
      'swiss-academic': {
        sans: "'Hanken Grotesk', -apple-system, sans-serif",
        mono: "'IBM Plex Mono', monospace",
        scale: 100,
        fsTitle: 15,
        lsTitle: -18,
        fsCode: 11.5,
        fsOcc: 10.5,
        fsTime: 11.5,
        hBtn: 28,
        fsBtn: 11
      },
      'linear-technical': {
        sans: "'Inter', -apple-system, sans-serif",
        mono: "'JetBrains Mono', monospace",
        scale: 104,
        fsTitle: 15.5,
        lsTitle: -22,
        fsCode: 12,
        fsOcc: 11,
        fsTime: 12,
        hBtn: 28,
        fsBtn: 11.5
      },
      'modern-jakarta': {
        sans: "'Plus Jakarta Sans', -apple-system, sans-serif",
        mono: "'JetBrains Mono', monospace",
        scale: 100,
        fsTitle: 15,
        lsTitle: -15,
        fsCode: 11.5,
        fsOcc: 10.5,
        fsTime: 11.5,
        hBtn: 28,
        fsBtn: 11
      },
      'readable-plus20': {
        sans: "'Hanken Grotesk', -apple-system, sans-serif",
        mono: "'JetBrains Mono', monospace",
        scale: 120,
        fsTitle: 16.5,
        lsTitle: -20,
        fsCode: 13,
        fsOcc: 12,
        fsTime: 13,
        hBtn: 32,
        fsBtn: 12.5
      }
    };

    document.querySelectorAll('.btn-preset').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.btn-preset').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const p = presets[btn.dataset.preset];
        if (!p) return;

        elSans.value = p.sans;
        elMono.value = p.mono;
        elGlobalScale.value = p.scale;
        elFsTitle.value = p.fsTitle;
        elLsTitle.value = p.lsTitle;
        elFsCode.value = p.fsCode;
        elFsOcc.value = p.fsOcc;
        elFsTime.value = p.fsTime;
        elHBtn.value = p.hBtn;
        elFsBtn.value = p.fsBtn;
        update();
      });
    });

    // Viewport Width Switchers
    document.querySelectorAll('.btn-stage-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.btn-stage-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const w = tab.dataset.width;
        viewport.style.width = w.includes('%') ? w : `${w}px`;
      });
    });

    // Dark Theme Toggle
    document.getElementById('chk-dark-theme').addEventListener('change', (e) => {
      const isDark = e.target.checked;
      document.body.classList.toggle('theme-dark', isDark);
      viewport.classList.toggle('theme-dark', isDark);
    });

    // Copy Toast Helper
    function showToast(msg) {
      toast.textContent = msg;
      toast.style.display = 'flex';
      setTimeout(() => { toast.style.display = 'none'; }, 2200);
    }

    function copyCSS() {
      navigator.clipboard.writeText(codeOutput.textContent).then(() => {
        showToast('✔ Production CSS copied to clipboard!');
      });
    }

    document.getElementById('btn-copy-css').addEventListener('click', copyCSS);
    document.getElementById('btn-copy-code-direct').addEventListener('click', copyCSS);

    document.getElementById('btn-reset').addEventListener('click', () => {
      document.querySelector('.btn-preset[data-preset="swiss-academic"]').click();
      showToast('🔄 Reset to default Swiss Academic spec');
    });

    // Initial Run
    update();
  </script>
