<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <clipPath id="squircle">
      <rect width="200" height="200" rx="44" ry="44"/>
    </clipPath>
  </defs>
  <g clip-path="url(#squircle)">
    <!-- Deep Black Background -->
    <rect width="200" height="200" fill="#000000"/>
    
    <!-- Outer Prism Triangle (Clean Single Base) -->
    <polygon points="100,36.4 33,150 167,150" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Incoming Light Incident Beam -->
    <polygon points="0,141.4 50.9,124.6 49.3,120.0 0,140.2" fill="#FFFFFF"/>
    
    <!-- Internal Refracted S-Core -->
    <polygon points="50.1,120.7 100.7,105.4 75.6,87.4 122.4,71.1 123.7,78.2 98.6,91.1 129.9,111.6 50.1,123.9" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linejoin="round"/>
    
    <!-- Outgoing Dispersed Spectral Rays -->
    <polygon points="122.8,72.1 200,39.8 200,39.2 122.0,70.1" fill="#FFFFFF"/>
    <polygon points="123.1,75.9 200,51.7 200,50.9 122.7,74.3" fill="#FFFFFF"/>
    <polygon points="124.1,79.9 200,64.4 200,63.6 123.7,78.3" fill="#FFFFFF"/>
  </g>
</svg>
